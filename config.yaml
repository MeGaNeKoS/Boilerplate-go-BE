AppName: example
Version: "1"
ExternalService:
  Example:
    Host: "https://localhost:8080"
Server:
  Environment: "dev"
  SkipTLSVerify: true
  Timeout:
    Server: 10
    Read: 10
    Write: 10
    Idle: 30
  Duration: 10
  Endpoint:
    Based: "/test"
  JWT:
    PrivateKey: ""
    PublicKey: ""
REST:
  Host: "0.0.0.0"
  Port: "8080"
GRPC:
  Host: "0.0.0.0"
  Port: "8081"
Kafka:
  Brokers: ["localhost:9092"]
  GroupID: "item-consumer"
  Topic: "items"
Database:
  Host: "db"
  Port: "3306"
  User: "app"
  Password: "app"
  DBName: "boilerplate"
  MigrationPath: "file://migrations"
  DirtyStrategy: "retry"
LogTarget:
  Path: "./log"
  FileName: "app.log"
  PerLevelFiles: {}
  VerboseLevel: "DEBUG"
  AlsoLogToStdout: true
OpenAPI:
  Version: "3.2.0"
  Docs:
    Public:
      url: "/docs/public"
      schema: "/schema/v1"
    Internal:
      url: "/docs/internal"
      schema: "/schema"
  Servers:
    Public: "http://192.168.1.134:8888"
    Internal: ""
